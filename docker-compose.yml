services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: save_my
      POSTGRES_USER: save_my
      POSTGRES_PASSWORD: save_my_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U save_my -d save_my"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - save_my_postgres:/var/lib/postgresql/data

  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://save_my:save_my_local@postgres:5432/save_my
      TEST_USER_EMAIL: judge@savemy.systems
      TEST_USER_PASSWORD: SaveMy-Judge-2026
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  save_my_postgres:
